_comment: AI 视频安监检测算法配置，修改后重启代码即可生效
supported_codes: ['0', '8', '10', '14', '33', '34', '38', '49', '50', '52', '53', '56', '59']

# 可用的 GPU 编码（GPU ID）列表。
# StreamWorker 创建时会按轮询方式依次使用列表中的 GPU，实现多路流的负载均衡。
# 空列表或省略该项时，默认使用 [0]。
gpu_codes: [0, 1]

