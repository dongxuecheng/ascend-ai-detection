# AI 视频安监检测系统 Docker Compose
# 仅启动主检测应用容器，外部服务（SAM3、Triton、任务平台等）通过环境变量指向
#
# 使用方式：
#   docker compose up -d
#
# 说明：
#   - 代码通过挂载当前目录到 /app 运行，方便修改后无需重新构建镜像
#   - 共享内存 /dev/shm 同时被 RTSP 拉流后端和 Triton 客户端使用，需要根据并发路数与分辨率调大
#   - 默认使用主机网络模式，便于访问宿主机上的 Triton Server（localhost:38000）
#     如不需要，可改为默认 bridge 网络并修改 TRITON_YOLO_URL 为容器可访问地址

services:
  aidetection:
    build:
      context: .
      dockerfile: Dockerfile
    image: aidetection:latest
    container_name: aidetection
    # 使用宿主机网络，可直接访问 localhost 上的 Triton / RTSP 流媒体后端
    # 如需隔离网络，请注释下行并调整配置中的服务地址
    network_mode: host
    # 容器内 /dev/shm 大小；当下面使用 bind mount /dev/shm:/dev/shm 时，实际大小由宿主机 /dev/shm 决定
    # RTSP 共享内存估算：每路流 ≈ 宽*高*3*8(slot) + 对齐开销；8 路 1080p 约 400MB，4K 约 1.6GB
    # 建议生产环境至少 2g~4g，并同时调大宿主机 /dev/shm
    shm_size: 20g
    restart: unless-stopped
    # 环境变量会优先从当前目录 .env 文件（Compose 自动加载）或 shell 中读取
    # 也可以在 environment 下直接修改默认值
    environment:
      # 运行环境：company / mhwj / 自定义
      AIDETECTION_ENV: ${AIDETECTION_ENV:-hdzp}
      # 日志级别：DEBUG / INFO / WARNING / ERROR
      AIDETECTION_LOG_LEVEL: ${AIDETECTION_LOG_LEVEL:-INFO}
      # Triton YOLO 推理服务地址
      TRITON_YOLO_URL: ${TRITON_YOLO_URL:-localhost:38000}
      # SAM3 推理服务地址
      SAM3_URL: ${SAM3_URL:-http://192.168.100.75:18002/predict}
      SAM3_URL_OBJ: ${SAM3_URL_OBJ:-http://192.168.100.75:18002/predict-person-about-small-object}
      # 任务/告警平台地址
      GET_TASK_URL: ${GET_TASK_URL:-http://192.168.100.73/open/api/operate/taskList}
      GET_FENCE_URL: ${GET_FENCE_URL:-http://192.168.100.73/open/api/operate/fence}
      GET_RTSP_URL: ${GET_RTSP_URL:-http://192.168.100.73/open/api/operate/previewURLs}
      UPLOAD_URL: ${UPLOAD_URL:-http://192.168.100.73/open/api/operate/upload}
      # 任务同步间隔（秒）
      REQUEST_INTERVAL: ${REQUEST_INTERVAL:-10}
      # Python 无缓冲输出，便于实时查看日志
      PYTHONUNBUFFERED: "1"
      # 容器时区，默认使用上海时间；可通过 shell 环境变量或 .env 覆盖
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 挂载当前目录代码到容器中运行
      - .:/app
      - /dev/shm:/dev/shm
      # 同步宿主机时区，避免容器内时间/日志时间不对
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    working_dir: /app
    command: ["python", "main.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

# 如果 RTSP 流媒体后端也容器化并放在同一个 compose 文件里，可以使用共享 tmpfs volume：
# volumes:
#   rtsp-shm:
#     driver: local
#     driver_opts:
#       type: tmpfs
#       device: tmpfs
#       o: "size=4g,uid=0,gid=0"
# 然后把两个服务的 volumes 都改成：
#   - rtsp-shm:/dev/shm
