sam3_urls:
- {code: '8', url: 'http://192.168.100.75:18002/predict'}
- {code: '14', url: 'http://192.168.100.75:18002/predict-person-about-small-object'}
- {code: '34', url: 'http://192.168.100.75:18003/predict'}

fence_algorithms:
- {code: '8'}

use_yolo_boxes:
- {code: '200'}

yolo_model_configs:
- name: yolo11_plan
  input_name: images
  output_name: output0
  input_size: 640
  output_format: yolo_v8_v11
  conf_thresh: 0.5
  iou_thresh: 0.45
  label_map_file: config/coco.names
- name: yolo12s_face
  input_name: images
  output_name: output0
  input_size: 1280
  output_format: yolo_v8_v11
  conf_thresh: 0.3
  iou_thresh: 0.45
  label_map_file: config/yolo12s_face.names
yolo_pre_detect:
- {code: '8', yolo11_plan: [person]}
- {code: '34', yolo11_plan: [person]}
- {code: '14', yolo11_plan: [person]}

algorithm_detectors:
- {code: '0', detectors: [HelmetDetector]}
- {code: '8', detectors: [ZoneDetector]}
- {code: '14', detectors: [SmokingDetector]}
- {code: '34', detectors: [SingleDetector]}
- {code: '58', detectors: [SafetyDetector]}
- {code: '200', detectors: [GloveDetector, ShieldDetector]}
- {code: '201', detectors: [HelmetDetector, ExposedArmLegDetector, GloveDetector]}
- {code: '204', detectors: [ZoneDetector]}
- {code: '205', detectors: [SafetyDetector]}

# 分类模型配置（用于对规则引擎检出的违规目标进行二次确认）
classification_configs:
- name: resnet_smoke
  model_name: resnet_smoke
  input_name: input
  output_name: output
  input_size: 224
  labels: [smoking, normal]
  conf_thresh: 0.5
  target_class: smoking
  expand_ratio: 2.0
  # 与 PyTorch 预处理对齐：ToTensor + Normalize
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# 算法码 -> 需要调用的分类器名称列表
algorithm_classifiers:
- {code: '14', classifiers: [resnet_smoke]}

alert_dedup:
- {code: '8', enabled: true, cooldown_seconds: 300, iou_thresh: 0.5}
- {code: '34', enabled: true, cooldown_seconds: 300}
