# SAM3 接口地址分组配置。
# 同一 URL 的算法码放在同一个 group 中；未在 groups 中配置的算法码将回退到 config.SAM3_URL_OBJ。
sam3_url_groups:
  - url: 'http://192.168.100.75:18002/predict'
    codes: ['8', '33', '34', '52', '53', '38', '56', '49', '59', '50']
  - url: 'http://192.168.100.75:18002/predict-person-about-small-object'
    codes: ['0', '14', '58']

fence_algorithms:
- {code: '8'}
- {code: '49'}
- {code: '33'}

use_yolo_boxes:
- {code: '200'}
- {code: '50'}

# YOLO 预检测配置：模型详细参数已迁移到 config/models.yaml
yolo_pre_detect:
- {code: '0', yolo11_plan: [person]}
- {code: '8', yolo11_plan: [person]}
- {code: '14', yolo11_plan: [person]}
- {code: '34', yolo11_plan: [person]}
- {code: '38', yolo11_plan: [person]}
- {code: '52', yolo11_plan: [person]}
- {code: '53', yolo11_plan: [person]}
- {code: '56', yolo11_plan: [person]}
- {code: '58', yolo11_plan: [person]}
- {code: '50', yolov5_foreign_objects: [dakuai]}


algorithm_detectors:
- {code: '0', detectors: [HelmetDetector]}
- {code: '8', detectors: [ZoneDetector]}
- {code: '10', detectors: [VestDetector]}
- {code: '14', detectors: [SmokingDetector]}
- {code: '33', detectors: [BeltDeviationDetector]}
- {code: '34', detectors: [SingleDetector]}
- {code: '52', detectors: [CarDetector]}
- {code: '53', detectors: [ExtinguisherDetector]}
- {code: '38', detectors: [DepartureDetector]}
- {code: '56', detectors: [PlayPhoneDetector]}
- {code: '49', detectors: [CoalDetector]}
- {code: '50', detectors: [CoalForeignObjectDetector]}
- {code: '59', detectors: [EmptyTruckDetector]}
- {code: '58', detectors: [HeightWorkDetector]}
- {code: '200', detectors: [GloveDetector, ShieldDetector]}
- {code: '201', detectors: [HelmetDetector, ExposedArmLegDetector, GloveDetector]}
- {code: '204', detectors: [ZoneDetector]}
- {code: '205', detectors: [SafetyDetector]}

# 算法码 -> VL 大模型二次复核配置
# enabled: 是否启用 VL 复核
# module: 对应的 VL prompt 模块名（llm/prompts/ 下的文件名，不含 .py）
# 未配置的算法码默认不启用 VL 复核
algorithm_vl_config:
- {code: '50', enabled: true, module: coal_foreign_object}
- {code: '58', enabled: true, module: height_work}
- {code: '205', enabled: true, module: safety}

# 算法码 -> 检测间隔（秒），StreamWorker 据此判断任务是否进入 ready 状态
# 未配置的算法码使用 DEFAULT_ALGORITHM_INTERVAL（默认 1.0 秒）
algorithm_intervals:
- {code: '0', interval: 5.0}
- {code: '8', interval: 5.0}
- {code: '10', interval: 5.0}
- {code: '14', interval: 5.0}
- {code: '33', interval: 5.0}
- {code: '34', interval: 2.0}
- {code: '52', interval: 5.0}
- {code: '53', interval: 5.0}
- {code: '38', interval: 5.0}
- {code: '56', interval: 5.0}
- {code: '49', interval: 600.0}
- {code: '50', interval: 30.0}
- {code: '58', interval: 5.0}
- {code: '59', interval: 5.0}
- {code: '200', interval: 5.0}
- {code: '201', interval: 5.0}
- {code: '204', interval: 5.0}
- {code: '205', interval: 5.0}

# 算法码 -> 需要调用的分类器名称列表（分类模型定义见 config/models.yaml）
algorithm_classifiers:
- {code: '14', classifiers: [resnet_smoke]}

alert_dedup:
