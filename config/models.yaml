_comment: 模型推理配置（YOLO / 分类模型）

yolo_model_configs:
  - name: YOLO26_DET_PRE_YUV_ENSEMBLE
    backend: ascend
    input_name: YUV
    input_size: 640
    conf_thresh: 0.5
    iou_thresh: 0.45
    label_map_file: config/names/coco.names
    max_detections: 300
  - name: YOLO11_DET_PRE_ENSEMBLE
    backend: ascend
    input_name: IMAGE
    input_size: 640
    conf_thresh: 0.5
    iou_thresh: 0.45
    label_map_file: config/names/coco.names
    max_detections: 300

# 新后端尚无异物 YOLOv5 和吸烟分类模型，提供昇腾模型后再配置。
classification_configs: []
