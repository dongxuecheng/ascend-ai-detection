# AI 视频安监检测系统 Docker Compose
# 仅启动主检测应用容器，外部服务（SAM3、Triton、任务平台等）通过环境变量指向
#
# 使用方式：
#   docker compose up -d
#
# 如果 RTSP 流媒体后端（grpc_rtsp）在另一个项目中，可通过 include 引入其 Compose 文件，
# 路径请按实际目录结构调整。
#
# 共享内存隔离说明：
#   - 本项目的 RTSP 拉流后端（grpc_rtsp）与 Python 客户端通过 /dev/shm 交换帧数据。
#   - 若同一台宿主机上运行多个项目，需避免 SHM 命名冲突。本文件通过 SHM_NAMESPACE
#     将 SHM 文件隔离到 /dev/shm/<SHM_NAMESPACE>/ 下。
#   - 首次部署前请在宿主机创建目录：mkdir -p /dev/shm/${SHM_NAMESPACE:-aidetection}
#
# 说明：
#   - 代码通过挂载当前目录到 /app 运行，方便修改后无需重新构建镜像
#   - 使用 Docker 默认 bridge 网络，内部服务（grpc_rtsp、triton）通过服务名访问

# 引入外部依赖服务的 Compose 文件路径，从 .env 读取。
# 若不需要引入某个服务，可在 .env 中将其路径指向一个空 compose 文件，或注释掉对应行。
include:
  - ${GRPC_RTSP_COMPOSE:-../grpc_rtsp/docker-compose.yml}
  - ${TRITON_COMPOSE:-../triton/docker-compose.yml}

services:
  aidetection:
    build:
      context: .
      dockerfile: Dockerfile
    image: aidetection:latest
    container_name: aidetection
    # 使用 Docker 默认 bridge 网络，与 include 引入的 grpc_rtsp / triton 服务通过服务名通信。
    # 如需访问宿主机上的外部服务（SAM3、任务平台等），请确保 Docker 网络可路由到对应 IP，
    # 或在 .env 中使用 host.docker.internal / 具体宿主机 IP。
    # 注意：使用 bind mount /dev/shm/<namespace>:/dev/shm 时，容器内实际容量由宿主机 /dev/shm 决定，
    # shm_size 字段不再生效。请直接在宿主机调整：mount -o remount,size=32G /dev/shm
    # RTSP 共享内存估算：每路流 ≈ 宽*高*3*8(slot) + 对齐开销；8 路 1080p 约 400MB，4K 约 1.6GB
    # 建议生产环境至少 32G，并同时调大宿主机 /dev/shm
    restart: unless-stopped
    # AIDetection 依赖 grpc_rtsp 和 triton 服务，确保先启动依赖。
    # 注意：depends_on 只控制启动顺序，不等待服务完全就绪；如需严格等待健康检查，
    # 请在 grpc_rtsp / triton 的 Compose 文件中配置 healthcheck 并使用 condition: service_healthy。
    depends_on:
      - grpc_rtsp
      - triton
    # 所有应用配置统一从项目根目录 .env 文件加载并注入容器
    # 这样 docker-compose.yml 本身不需要维护具体配置值，修改 .env 即可
    env_file:
      - .env
    volumes:
      # 挂载当前目录代码到容器中运行
      - .:/app
      # 项目级 SHM 隔离：同一宿主机多个项目运行时，避免 stream_id 冲突。
      # 与 grpc_rtsp 服务端挂载同一个宿主机目录，双方通过 /dev/shm/{stream_id} 交互。
      - /dev/shm/${SHM_NAMESPACE:-aidetection}:/dev/shm
      # 违章原图本地保存目录：按类别和日期落盘
      - /mnt/yolo/images:/mnt/yolo/images
      # 同步宿主机时区，避免容器内时间/日志时间不对
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    working_dir: /app
    command: ["python", "main.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

# 如果 RTSP 流媒体后端（grpc_rtsp）也放在同一个 compose 文件里，请确保：
#   1. 两个 service 挂载同一个宿主机 SHM 目录：
#        - /dev/shm/${SHM_NAMESPACE:-aidetection}:/dev/shm
#   2. 服务端创建 SHM 文件时权限设置为 0666，或两个容器使用相同 UID/GID。
#   3. stream_id 包含项目前缀，避免与其他项目冲突。
